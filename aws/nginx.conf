server {
    listen 80;
    server_name _;

    # ── API → FastAPI Backend ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # File upload size limit (match MAX_UPLOAD_SIZE_MB)
        client_max_body_size 15M;
    }

    # ── Health check endpoint (used by ALB) ───────────────────────────────────
    location /api/health {
        proxy_pass http://127.0.0.1:8000/api/health;
        access_log off;
    }

    # ── Static React Frontend (if served from EC2) ────────────────────────────
    # Comment this block out if you use S3 + CloudFront for the frontend
    location / {
        root   /var/www/html;
        index  index.html;
        try_files $uri $uri/ /index.html;  # React Router SPA fallback
    }

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff"      always;
}
